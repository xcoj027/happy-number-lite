    <polygon points="110,760 320,760 215,580" stroke="#f8e16c"/>
    <rect x="1740" y="720" width="180" height="180" rx="26" stroke="#00c49a" transform="rotate(18 1830 810)"/>
    <path d="M 300 300 h 90 M 345 255 v 90" stroke="#ff7b4b" stroke-width="10" stroke-linecap="round"/>
